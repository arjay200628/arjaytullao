    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4fff6;
            color: #1f3d2a;
        }

        .navbar {
            background-color: #000000;
            padding: 20px 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .brand {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin: 0;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-links {
            display: flex;
            gap: 12px;
            margin-left: auto;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .brand {
            color: white;
        }

        .navbar a:hover {
            background-color: rgba(255,255,255,0.2);
        }

        .container {
            width: 98%;
            max-width: 1600px;
            min-height: 75vh;
            margin: 30px auto;
            padding: 50px;
            background-color: transparent;
            border-radius: 0;
            box-shadow: none;
            box-sizing: border-box;
        }

        .hero {
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            padding: 40px;
            border-radius: 10px;
            margin-bottom: 24px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            border: 1px solid #c8e6c9;
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.6;
        }

        .card {
            border: 1px solid #c8e6c9;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 18px;
            background-color: #fafdfa;
            min-height: 140px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card h1, .card h2 {
            font-size: 26px;
            margin-top: 0;
        }

        .card p, .card li {
            font-size: 18px;
            line-height: 1.6;
        }

        .skills {
            padding-left: 20px;
        }

    </style>
</head>
<body>
    <div class="navbar">
        <div class="brand">My Portfolio</div>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about_me' %}">About Me</a>
            <a href="{% url 'personal_information' %}">Personal Info</a>
            <a href="{% url 'projects' %}">My Projects</a>
            <a href="{% url 'contacts' %}">Contacts</a>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
