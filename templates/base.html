<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --bg-soft: #EEF7EE;
            --card-bg: #FFFFFF;
            --primary-green: #14532D;
            --secondary-green: #166534;
            --accent-green: #22C55E;
            --border-soft: #D1E7DD;
            --text-dark: #1F2937;
            --text-muted: #475569;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-soft);
            color: var(--text-dark);
        }

        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-soft);
            padding: 1rem 0;
        }

        .navbar-brand {
            color: var(--primary-green) !important;
            font-weight: 700;
        }

        .nav-link {
            color: var(--text-dark) !important;
            font-weight: 500;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary-green) !important;
        }

        .card-custom,
        .form-card,
        .stat-card,
        .testimonial-card,
        .contact-card,
        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            box-shadow: 0 8px 18px rgba(31, 41, 55, 0.08);
        }

        .hero-card {
            border-radius: 16px;
        }

        .hero-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: var(--primary-green);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .badge-soft {
            background-color: rgba(34, 197, 94, 0.14);
            color: var(--primary-green);
            font-weight: 600;
            border-radius: 999px;
            padding: 0.45rem 0.85rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-green);
            margin-bottom: 0.75rem;
        }

        .section-text {
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            line-height: 1.7;
        }

        .project-title,
        .testimonial-title,
        .contact-title {
            color: var(--primary-green);
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .btn-primary-custom {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
            color: #ffffff;
        }

        .btn-primary-custom:hover {
            background-color: var(--secondary-green);
            border-color: var(--secondary-green);
        }

        .btn-outline-custom {
            color: var(--primary-green);
            border-color: var(--primary-green);
        }

        .btn-outline-custom:hover {
            background-color: rgba(34, 197, 94, 0.12);
            color: var(--primary-green);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .input-field {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            background-color: #ffffff;
            color: var(--text-dark);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--secondary-green);
            box-shadow: 0 0 0 0.15rem rgba(34, 197, 94, 0.18);
            background-color: #ffffff;
        }

        .testimonial-card blockquote {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-dark);
            margin: 0;
        }

        .testimonial-quote {
            font-size: 2.25rem;
            color: var(--accent-green);
            line-height: 0.8;
        }

        .footer-note {
            color: var(--text-muted);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">My Portfolio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'about_me' %}">About</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'personal_information' %}">Info</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'projects' %}">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'testimonials' %}">Testimonials</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'contacts' %}">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    {% block content %}{% endblock %}
</main>

<footer class="container text-center py-4">
    <p class="footer-note mb-0">{{ personal_info.first_name|default:'My' }} {{ personal_info.last_name|default:'Portfolio' }} &bull; Built with Django and Bootstrap.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
