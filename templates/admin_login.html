{% extends 'base.html' %}

{% block title %}Admin Sign In | My Portfolio{% endblock %}

{% block content %}
<div class="card-custom p-4 p-md-5 mx-auto" style="max-width: 520px;">
    <h2 class="section-title text-center mb-4">Admin Sign In</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger" role="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <div class="text-center mb-3">
        <a href="{% url 'register' %}" class="btn btn-outline-custom w-100">Create Account</a>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary btn-primary-custom w-100">Sign In</button>
    </form>
</div>
{% endblock %}
