{% extends 'base.html' %}

{% block title %}Leave a Testimony | My Portfolio{% endblock %}

{% block content %}
<div class="card-custom p-4 p-md-5 form-card mx-auto" style="max-width: 720px;">
    <h2 class="section-title mb-4">Leave a Testimony</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group"> {{ form.full_name.label_tag }} {{ form.full_name }} </div>
        <div class="form-group"> {{ form.content.label_tag }} {{ form.content }} </div>
        <button class="btn btn-primary btn-primary-custom" type="submit">Submit Testimony</button>
    </form>
</div>
{% endblock %}
